# Reusable workflow: compile once, then run test matrix in parallel.
# Called by ci.yml (push/PR builds) and nightly.yml (scheduled builds).
#
# --- Caching strategy ---
#
# Two complementary mechanisms transfer state to downstream jobs:
#
# 1. GitHub Actions cache (dependency cache):
#    Stores downloaded dependencies (~/.gradle/caches/, ~/.m2/repository/, wrappers).
#    Only the initial build *saves* this cache, and only on non-PR events (push,
#    schedule, workflow_dispatch) to avoid accumulating per-PR cache entries.
#    All other jobs -- including the initial build on PRs -- restore it read-only.
#
# 2. Build cache tarball (artifact):
#    The initial build uploads ~/.gradle/caches/build-cache-1 as an artifact.
#    Test and example jobs download and extract it to skip recompilation.
#    This is ephemeral (retention-days: 1) and scoped to the current workflow run.

name: CI Build

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to checkout (empty = event ref)'
        type: string
        required: false
        default: ''
      initial-build-runs-on:
        description: 'Runner label for the initial build job'
        type: string
        required: false
        default: 'ubuntu-latest'
      matrix-json:
        description: 'JSON array of test matrix entries'
        type: string
        required: true
      run-examples:
        description: 'Whether to run example project tests'
        type: boolean
        required: false
        default: true
      run-sonar:
        description: 'Whether to prepare a Sonar coverage bundle after tests'
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

env:
  GRADLE_JAVA_VERSION: '17'

permissions: { }

jobs:
  # Compile-only build: compiles all sources and renders documentation,
  # but does NOT run tests. Shares its local Gradle build cache as a tarball artifact
  # so that downstream jobs can skip recompilation.
  build:
    name: Initial build
    runs-on: >-
      ${{
        github.repository == 'hibernate/hibernate-reactive' && inputs.initial-build-runs-on
        || !contains(inputs.initial-build-runs-on, 'runs-on') && inputs.initial-build-runs-on
        || 'ubuntu-latest'
      }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Set up RunsOn
        if: ${{ contains(inputs.initial-build-runs-on, 'runs-on') && github.repository == 'hibernate/hibernate-reactive' }}
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.branch }}
      - name: Set up Gradle JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.GRADLE_JAVA_VERSION }}

      - name: Cache local Gradle repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          path: |
            ~/.m2/repository/
            ~/.m2/wrapper/
            ~/.gradle/caches/
            !~/.gradle/caches/build-cache-*
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Restore local Gradle repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: |
            ~/.m2/repository/
            ~/.m2/wrapper/
            ~/.gradle/caches/
            !~/.gradle/caches/build-cache-*
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run build script
        run: ./gradlew assemble compileTestJava :documentation:asciidoctor --build-cache
        env:
          POPULATE_REMOTE_GRADLE_CACHE: ${{ github.event_name != 'pull_request' && github.repository == 'hibernate/hibernate-reactive' && 'true' || 'false' }}
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY }}"

      - name: Create build cache tarball
        run: tar -czf gradle-build-cache.tgz -C ~ .gradle/caches/build-cache-1
      - name: Upload build cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-build-cache
          retention-days: 1
          path: gradle-build-cache.tgz

      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "${{ github.event_name == 'pull_request' && !cancelled() }}"
        with:
          name: build-scan-data-initial
          path: ~/.gradle/build-scan-data
      - name: Upload docs preview
        uses: hibernate/.github/actions/build-docs-preview@709cd8c0127dfa8918b6845cf476e72d2c2a04a8 # main
        with:
          dist-path: 'documentation/build/asciidoc'
          src-paths: |
            documentation/src

  # Matrix-driven test jobs. Each entry downloads the build cache tarball from the
  # initial build and runs the full test suite against a specific database or JDK.
  test:
    name: >-
      ${{ matrix.name
      }}${{ matrix.java-test-version && format(' {0}', matrix.java-test-version)
      || '' }}
    needs: build
    runs-on: >-
      ${{
        github.repository == 'hibernate/hibernate-reactive' && matrix.runs-on
        || !contains(matrix.runs-on || '', 'runs-on') && matrix.runs-on
        || 'ubuntu-latest'
      }}
    timeout-minutes: ${{ matrix.timeout != '' && matrix.timeout || 60 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix-json) }}
    steps:
      - name: Set up RunsOn
        if: ${{ contains(matrix.runs-on || '', 'runs-on') && github.repository == 'hibernate/hibernate-reactive' }}
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.branch }}
      - name: Compute entry label
        run: |
          echo "ENTRY_LABEL=${_LABEL//[\":<>|*?\\\/]/-}" >> "$GITHUB_ENV"
        env:
          _LABEL: ${{ matrix.name }}

      # --- JDK setup ---
      # Install test JDK first (if needed), capture its home,
      # then install the default JDK (GRADLE_JAVA_VERSION) which becomes JAVA_HOME for the Gradle daemon.
      - name: Set up test JDK ${{ matrix.java-test-version }}
        if: ${{ matrix.java-test-version && matrix.java-test-version != env.GRADLE_JAVA_VERSION && matrix.java-test-from != 'jdk.java.net' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-test-version }}
      - name: Set up test JDK ${{ matrix.java-test-version }} (EA from jdk.java.net)
        if: ${{ matrix.java-test-from == 'jdk.java.net' }}
        uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
        with:
          website: jdk.java.net
          release: ${{ matrix.java-test-version }}
      - name: Capture test JDK home
        if: ${{ matrix.java-test-version && matrix.java-test-version != env.GRADLE_JAVA_VERSION }}
        run: echo "TEST_JDK_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up Gradle JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.GRADLE_JAVA_VERSION }}

      # --- Caching (restore-only: initial build saves the cache) ---
      - name: Restore local Gradle repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository/
            ~/.m2/wrapper/
            ~/.gradle/caches/
            !~/.gradle/caches/build-cache-*
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Download build cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: gradle-build-cache
      - name: Extract build cache
        run: |
          tar -xzf gradle-build-cache.tgz -C ~
          rm gradle-build-cache.tgz

      # --- Build and test ---
      - name: Run build script
        run: |
          gradle_args=(--build-cache)

          # Database selection
          if [[ -n "$RDBMS" ]]; then
            gradle_args+=("-Pdb=$RDBMS")
          fi

          # JDK toolchain args
          jdk_paths="$JAVA_HOME"
          if [[ -n "$JAVA_TEST_VERSION" ]]; then
            gradle_args+=("-Ptest.jdk.version=$JAVA_TEST_VERSION")
            if [[ -n "$TEST_JDK_HOME" && "$TEST_JDK_HOME" != "$JAVA_HOME" ]]; then
              jdk_paths="$jdk_paths,$TEST_JDK_HOME"
            fi
          fi
          if [[ -n "$JAVA_LAUNCHER_ARGS" ]]; then
            gradle_args+=("-Ptest.jdk.launcher.args=$JAVA_LAUNCHER_ARGS")
          fi
          if [[ "$jdk_paths" == *","* ]]; then
            gradle_args+=("-Porg.gradle.java.installations.paths=$jdk_paths")
          fi

          ./gradlew build "${gradle_args[@]}"
        env:
          RDBMS: ${{ matrix.rdbms || '' }}
          JAVA_TEST_VERSION: ${{ matrix.java-test-version || '' }}
          JAVA_LAUNCHER_ARGS: ${{ matrix.java-launcher-args || '' }}
          POPULATE_REMOTE_GRADLE_CACHE: ${{ github.event_name != 'pull_request' && github.repository == 'hibernate/hibernate-reactive' && 'true' || 'false' }}
          DEVELOCITY_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY }}"

      # --- Artifacts ---
      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "${{ github.event_name == 'pull_request' && !cancelled() }}"
        with:
          name: build-scan-data-${{ env.ENTRY_LABEL }}
          path: ~/.gradle/build-scan-data
      - name: Store coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: build-coverage-data-${{ env.ENTRY_LABEL }}
          retention-days: 1
          path: |
            ./**/build/jacoco/*.exec
      - name: Upload test reports (if build failed)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-reports-${{ env.ENTRY_LABEL }}
          path: |
            ./**/build/reports/tests/

  # Example project tests. Each entry downloads the build cache tarball from the
  # initial build and runs the examples against database service containers.
  run-examples:
    name: >-
      Examples - ${{ matrix.example }} on ${{ matrix.db }}
    needs: build
    if: ${{ inputs.run-examples }}
    runs-on: >-
      ${{
        github.repository == 'hibernate/hibernate-reactive' && 'runs-on/fleet=linux-standard/env=commonhaus'
        || 'ubuntu-latest'
      }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: 'session-example', db: 'PostgreSQL' }
          - { example: 'session-example', db: 'MySQL' }
          - { example: 'native-sql-example', db: 'PostgreSQL' }
    services:
      mysql:
        image: container-registry.oracle.com/mysql/community-server:9.3.0
        env:
          MYSQL_ROOT_PASSWORD: hreact
          MYSQL_DATABASE: hreact
          MYSQL_USER: hreact
          MYSQL_PASSWORD: hreact
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_DB: hreact
          POSTGRES_USER: hreact
          POSTGRES_PASSWORD: hreact
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Set up RunsOn
        if: ${{ github.repository == 'hibernate/hibernate-reactive' }}
        uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.branch }}
      - name: Set up Gradle JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.GRADLE_JAVA_VERSION }}

      # --- Caching (restore-only: initial build saves the cache) ---
      - name: Restore local Gradle repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository/
            ~/.m2/wrapper/
            ~/.gradle/caches/
            !~/.gradle/caches/build-cache-*
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Download build cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: gradle-build-cache
      - name: Extract build cache
        run: |
          tar -xzf gradle-build-cache.tgz -C ~
          rm gradle-build-cache.tgz

      - name: Print effective ORM version
        run: ./gradlew ":$EXAMPLE:dependencyInsight" --dependency org.hibernate.orm:hibernate-core --build-cache
        env:
          EXAMPLE: ${{ matrix.example }}
      - name: Run examples
        run: ./gradlew ":$EXAMPLE:runAllExamplesOn$DB" --build-cache
        env:
          EXAMPLE: ${{ matrix.example }}
          DB: ${{ matrix.db }}

      - name: Upload test reports (if build failed)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-reports-examples-${{ matrix.example }}-${{ matrix.db }}
          path: './**/build/reports/'
      - name: Upload GitHub Actions artifact for the Develocity build scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: "${{ !cancelled() }}"
        with:
          name: build-scan-data-examples-${{ matrix.example }}-${{ matrix.db }}
          path: ~/.gradle/build-scan-data
          retention-days: 1

  # Merges JaCoCo reports from all test jobs into a single artifact for the Sonar
  # scanner (run separately by the calling workflow).
  prepare-sonar-bundle:
    name: Prepare build bundle for Sonar scanner
    needs: [test, run-examples]
    if: >-
      inputs.run-sonar
      && always() && !cancelled()
      && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.branch }}
      - name: Set up Gradle JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.GRADLE_JAVA_VERSION }}
          distribution: 'temurin'

      - name: Restore local Gradle repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository/
            ~/.m2/wrapper/
            ~/.gradle/caches/
            !~/.gradle/caches/build-cache-*
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Download build cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: gradle-build-cache
      - name: Extract build cache
        run: |
          tar -xzf gradle-build-cache.tgz -C ~
          rm gradle-build-cache.tgz

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: build-coverage-data*
          path: .
          merge-multiple: 'true'
        continue-on-error: true

      - name: Merge Jacoco Reports
        run: ./gradlew mergeCodeCoverageReport copyDependenciesSonar --no-parallel --build-cache

      - name: Store build info for Sonar scanning
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-results-data
          retention-days: 1
          path: |
            ./**/build/jacoco/*.exec
            ./**/build/classes/
            ./**/build/generated/
            ./**/build/resources/
            ./**/build/reports/
            ./**/build/sonar-dependencies/
