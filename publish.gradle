apply plugin: 'java'
apply from: rootProject.file( 'publish-common.gradle' )

// Java / publishing

java {
    // Configure the Java "software component" to include javadoc and sources jars in addition to the classes jar.
    // Ultimately, this component is what makes up the publication for this project.
    withJavadocJar()
    withSourcesJar()
}

jar {
    manifest {
        attributes(
                // Basic JAR manifest attributes
                'Specification-Title': project.name,
                'Specification-Version': project.version,
                'Specification-Vendor': 'Hibernate.org',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Hibernate.org',
                'Implementation-Vendor-Id': 'org.hibernate',
                'Implementation-Url': 'https://hibernate.org/reactive',
        )
    }
}

javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        named( "publishedArtifacts", MavenPublication ) {
            from components.java
            // Publish the versions we resolved, not the declared ones:
            // the wip branches use dynamic versions (e.g. 8.0.+) that Maven doesn't understand
            versionMapping {
                allVariants {
                    fromResolutionResult()
                }
            }
        }
    }
}
