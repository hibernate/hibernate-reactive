apply plugin: 'java'
apply from: rootProject.file( 'publish-common.gradle' )

// Java / publishing

java {
    // Configure the Java "software component" to include javadoc and sources jars in addition to the classes jar.
    // Ultimately, this component is what makes up the publication for this project.
    withJavadocJar()
    withSourcesJar()
}

def moduleNameBase = project.name.startsWith( 'hibernate-' ) ? name.drop( 'hibernate-'.length() ): name
def moduleName = "org.hibernate.$moduleNameBase".replace('-','.')

jar {
    manifest {
        attributes(
                // Basic JAR manifest attributes
                'Specification-Title': project.name,
                'Specification-Version': project.version,
                'Specification-Vendor': 'Hibernate.org',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Hibernate.org',
                'Implementation-Vendor-Id': 'org.hibernate',
                'Implementation-Url': 'https://hibernate.org/reactive',
				'Automatic-Module-Name': moduleName,
        )
    }
	metaInf {
		from(rootProject.projectDir, {
			include "LICENSE"
		})
	}
}

publishing {
    publications {
        named( "publishedArtifacts", MavenPublication ) {
            from components.java
        }
    }
}

// Reduce the size of per-module javadoc jars published to Maven Central.
// These options are intentionally NOT in hr-java-library.gradle,
// so that the aggregated javadoc published to docs.hibernate.org is unaffected.
tasks.withType(Javadoc).configureEach {
	exclude '**/spi/**'
	configure( options ) {
		addStringOption('-override-methods', 'summary')
		use = false
		noTree = true
	}
}
